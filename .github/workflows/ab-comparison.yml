name: Patch A A/B Comparison (temporary)
on:
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python3 run_ab_comparison.py nifty500.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ab-comparison-results
          path: |
            ab_comparison_summary.json
            ab_comparison_detail.csv

name: Weekly Golden Crossover Scan (Nifty 500)

on:
  schedule:
    # Runs every Saturday at 06:00 IST (00:30 UTC) — after weekly close
    - cron: '30 0 * * 6'
  workflow_dispatch:  # Manual trigger from GitHub UI

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Nifty 500 crossover scan
        run: python crossover_scan.py

      - name: Commit results
        run: |
          git config user.name "golden-cross-bot"
          git config user.email "bot@golden-cross-monitor"
          git add crossovers.md crossovers.json
          git diff --staged --quiet || git commit -m "crossover-scan: $(date -u '+%Y-%m-%d')"
          git push

      - name: Create issue for fresh crosses
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Parse crossovers.json for fresh golden crosses
          FRESH=$(python3 -c "
          import json
          data = json.load(open('crossovers.json'))
          fresh = [s for s in data['stocks'] if s.get('freshness', '').startswith('🆕')]
          if not fresh:
              exit(0)
          lines = []
          for f in fresh:
              di = '✓' if f['di_bullish'] else '✗'
              pa = '✓' if f['price_above_both'] else '✗'
              lines.append(f\"| {f['symbol']} | ₹{f['ltp']} | ₹{f['sma100']} | ₹{f['sma350']} | {f['cross_date']} | {f['rsi']} | {f['adx']} | {di} | {pa} |\")
          table = '| Symbol | LTP | SMA 100 | SMA 350 | Cross Date | RSI | ADX | +DI>-DI | Price>SMAs |\n|--------|-----|---------|---------|------------|-----|-----|---------|------------|\n' + '\n'.join(lines)
          print(table)
          ")

          if [ -n "$FRESH" ]; then
            DATE=$(date -u '+%Y-%m-%d')
            COUNT=$(echo "$FRESH" | grep -c '|')
            TOTAL=$(python3 -c "import json; d=json.load(open('crossovers.json')); print(d['golden_cross_count'])")
            BODY=$(cat <<EOF
          ## 🆕 Fresh golden crosses — $DATE

          $FRESH

          ---
          **Total active golden crosses:** $TOTAL

          [Full report →](../blob/main/crossovers.md)
          EOF
          )
            gh issue create \
              --title "🆕 $COUNT fresh golden cross(es) — $DATE" \
              --body "$BODY" \
              --label "crossover"
          fi

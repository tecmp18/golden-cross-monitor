name: Daily Golden Cross Scan

on:
  schedule:
    # Runs at 16:30 IST (11:00 UTC) — after Indian market close
    - cron: '0 11 * * 1-5'
  workflow_dispatch:  # Manual trigger from GitHub UI

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        run: python scanner.py

      - name: Commit results
        run: |
          git config user.name "golden-cross-bot"
          git config user.email "bot@golden-cross-monitor"
          git add status.md status.json docs/status.json
          git diff --staged --quiet || git commit -m "scan: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push

      - name: Create alert issue if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ALERTS=$(python3 -c "
          import json
          data = json.load(open('status.json'))
          alerts = [s for s in data['stocks'] if s.get('exit_t1') or s.get('exit_t2')]
          if not alerts:
              exit(0)
          lines = []
          for a in alerts:
              t1 = '✓' if a.get('gc_50_200') else '✗'
              t2 = '✓' if a.get('gc_200_350') else '✗'
              lines.append(f\"| {a['symbol']} | {a['status']} | ₹{a['ltp']} | {t1} | {t2} |\")
          table = '| Symbol | Status | LTP | 50/200 | 200/350 |\n|--------|--------|-----|--------|---------|' + '\n' + '\n'.join(lines)
          print(table)
          ")

          if [ -n "$ALERTS" ]; then
            DATE=$(date -u '+%Y-%m-%d')
            BODY=$(cat <<EOF
          ## ⚠️ Action required — $DATE

          $ALERTS

          ---
          [Full report →](../blob/main/status.md)
          EOF
          )
            gh issue create \
              --title "🚨 Alert: $DATE" \
              --body "$BODY" \
              --label "alert"
          fi
